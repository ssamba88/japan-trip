* { box-sizing: border-box; }

h1, h2, h3 { color: var(--ink); margin: 0; line-height: 1.35; }
h1 { font-family: var(--f-head); font-size: 22px; font-weight: 800; }
h2 { font-family: var(--f-head); font-size: 20px; font-weight: 800; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sub); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; font-weight: 700; }
svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* header */
.top { padding-top: 18px; padding-bottom: 10px; }
.top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 13px; color: var(--text); letter-spacing: .02em; }
.top-actions { display: flex; gap: 8px; flex: none; }
.icon-btn {

.icon-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.notice { margin: 8px 0 0; padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--ink); font-size: 14px; }

/* day tabs */
.daytabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0 16px; }
.daytab {
  min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
  color: var(--ink); font-weight: 700; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2;
  border-bottom: 4px solid var(--dc);
}
.daytab small { font-weight: 400; font-size: 11px; color: var(--text); }
.daytab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.daytab[aria-selected="true"] small { color: var(--bg); opacity: .8; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; }
.dayhead { border-left: 6px solid var(--dc); }
.dayhead p { font-size: 14px; margin-top: 4px; }

.timeline { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 12px; }
.stop { display: grid; grid-template-columns: 54px 1fr; column-gap: 24px; align-items: start; }
.stop .time { padding-top: 14px; text-align: right; font-weight: 700; color: var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stop .card { position: relative; }
.stop .card::before { content: ""; position: absolute; left: -17px; top: 22px; width: 10px; height: 10px; border-radius: 50%; background: var(--dc); }
.move { font-size: 13px; color: var(--ok); font-weight: 500; margin-top: 2px; }
.note { font-size: 14px; margin-top: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btn {

.btn.sm { min-height: 44px; padding: 0 14px; font-size: 14px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: default; }

.stack { display: grid; gap: 12px; margin-top: 12px; }
.sec-title { margin: 22px 0 8px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.muted { font-size: 13px; color: var(--text); }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.big { font-family: var(--f-head); font-size: 26px; color: var(--ink); font-weight: 800; }
.pos { color: var(--ok); }
.neg { color: var(--warn); }

/* checklist */
.progress { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 8px; }
.progress > i { display: block; height: 100%; background: var(--ok); }
.check { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 8px 4px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; }
.check:last-child { border-bottom: 0; }
.box { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--text); flex: none; display: grid; place-items: center; color: var(--accent-ink); }
.check[aria-checked="true"] .box { background: var(--ok); border-color: var(--ok); }
.check[aria-checked="true"] .lbl { text-decoration: line-through; opacity: .7; }
.check[disabled] { cursor: default; }
.lbl { flex: 1; min-width: 0; overflow-wrap: anywhere; }

/* forms */
label { display: block; font-size: 14px; font-weight: 500; color: var(--ink); margin: 12px 0 4px; }
input[type=text], input[type=number], input[type=date], select, textarea {
  width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink);

textarea { min-height: 88px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btnrow .btn { flex: 1 1 120px; }

/* bottom tabs */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabbar nav { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: none; border: 0; color: var(--text); font-size: 12px; font-weight: 500; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 700; }

.sheet { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet .back { position: absolute; inset: 0; background: rgba(20, 12, 8, .55); }
.sheet .panel {
  position: relative; width: 100%; max-width: 480px; max-height: 88%; overflow-y: auto;

.sheet .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 50; max-width: 90%; padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: 14px; }

.lang { display: grid; gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.lang:last-child { border-bottom: 0; }
.lang b { color: var(--ink); }
.jp { font-size: 17px; color: var(--ink); }
.empty { text-align: center; padding: 28px 12px; font-size: 14px; }
.status-pill { font-size: 12px; }
@media (prefers-reduced-motion: no-preference) {
  .progress > i { transition: width .25s ease; }
}
</style>

    var h = '<div class="card"><div class="row"><h3>준비 진행률</h3><span class="num">' + done + " / " + total + '</span></div><div class="progress" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + pct + '%"></i></div></div>';
    cats.forEach(function (c) {
      h += '<h2 class="sec-title">' + esc(c.cat) + '</h2><div class="card">';
      c.items.forEach(function (i) {
        var on = !!state.checks[i.id];
        h += '<div class="row" style="gap:0"><button class="check" type="button" role="checkbox" aria-checked="' + on + '" data-act="check" data-id="' + esc(i.id) + '"' + (state.edit ? "" : " disabled") + '><span class="box">' + (on ? ic("tick") : "") + '</span><span class="lbl">' + esc(i.text) + "</span></button>" +
          (state.edit && i.custom ? '<button class="icon-btn" type="button" aria-label="삭제" data-act="pack-del" data-id="' + esc(i.id) + '">' + ic("trash") + "</button>" : "") + "</div>";
      });
      h += "</div>";
    });
    if (state.edit) h += '<div class="btnrow"><button class="btn" type="button" data-act="pack-add">' + ic("plus") + "준비물 추가</button></div>";
    else if (!state.canWrite) h += '<p class="muted" style="margin-top:12px">체크는 여행을 관리하는 사람만 바꿀 수 있어요.</p>';
    return h;
  }

  function viewMore() {
    var h = "";
    if (state.canWrite) {
      h += '<div class="card"><h3>여행 설정</h3><p class="muted">출발일을 넣으면 상단에 D-day가 보여요.</p><div class="btnrow"><button class="btn ghost sm" type="button" data-act="settings">' + ic("pencil") + "출발일 설정" + (state.settings.startDate ? " (" + esc(state.settings.startDate) + ")" : "") + "</button></div></div>";
    }
    h += '<h2 class="sec-title">날씨</h2><div class="card"><div class="kv"><span>후쿠오카 1월 하순 평년</span><span class="num">낮 약 10도 · 밤 약 3도</span></div><div class="kv"><span>유후인 (산간)</span><span class="num">후쿠오카보다 훨씬 춥고 눈, 결빙 가능</span></div><p class="muted">평년 기준의 대략적인 값이에요. 출발 일주일 전부터 예보를 확인하세요.</p><div class="actions"><a class="btn ghost sm" href="https://www.jma.go.jp/bosai/forecast/" target="_blank" rel="noopener">' + ic("ext") + '일본 기상청 예보</a><a class="btn ghost sm" href="https://tenki.jp/" target="_blank" rel="noopener">' + ic("ext") + "tenki.jp</a></div></div>";
    h += '<h2 class="sec-title">환율 계산기</h2><div class="card"><label for="rateIn">100엔당 원 (직접 입력)</label><input id="rateIn" type="number" inputmode="decimal" min="1" step="0.1" value="' + esc(rate()) + '">' +
      '<div class="grid2"><div><label for="jpyIn">엔 (JPY)</label><input id="jpyIn" type="number" inputmode="decimal" min="0" placeholder="10000"></div><div><label for="krwIn">원 (KRW)</label><input id="krwIn" type="number" inputmode="decimal" min="0" placeholder="90000"></div></div>' +
      '<p class="muted" style="margin-top:8px">기본 환율은 예시값이에요. 출발 전에 실제 환율로 바꿔 주세요.</p>' +
      (state.canWrite ? '<div class="btnrow"><button class="btn ghost sm" type="button" data-act="rate-save">이 환율을 가족 기준으로 저장</button></div>' : "") + "</div>";
    h += '<h2 class="sec-title">일본어 회화</h2><div class="card">' + PHRASES.map(function (p) {
      return '<div class="lang"><b>' + esc(p[0]) + '</b><span class="jp" lang="ja">' + esc(p[1]) + '</span><span class="muted">' + esc(p[2]) + "</span></div>";
    }).join("") + "</div>";
    h += '<h2 class="sec-title">긴급 연락처</h2><div class="card">' + CONTACTS.map(function (c, i) {
      return '<div class="kv"><div><b style="color:var(--ink)">' + esc(c[0]) + '</b><div class="muted">' + esc(c[2]) + '</div></div><div class="row" style="gap:8px"><span class="num">' + esc(c[1]) + '</span><button class="btn ghost sm" type="button" data-act="copy" data-i="' + i + '">복사</button></div></div>';
    }).join("") + '<p class="muted">번호는 출발 전에 공식 사이트에서 한 번 더 확인하세요.</p></div>';
    return h;
  }

  function render() {
    renderChrome();
    var a = document.activeElement;
    if (state.tab === "more" && $main.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { state.dirty = true; return; }
    state.dirty = false;
    var views = { schedule: viewSchedule, map: viewMap, money: viewMoney, booking: viewBooking, packing: viewPacking, more: viewMore };
    $main.innerHTML = (views[state.tab] || viewSchedule)();
    if (state.tab === "more") bindCalc();
  }

  function bindCalc() {
    var r = document.getElementById("rateIn"), j = document.getElementById("jpyIn"), k = document.getElementById("krwIn");
    if (!r) return;
    function curRate() { var v = Number(r.value); return v > 0 ? v : rate(); }
    r.addEventListener("input", function () { if (j.value !== "") k.value = Math.round(Number(j.value) * curRate() / 100); });
    j.addEventListener("input", function () { k.value = j.value === "" ? "" : Math.round(Number(j.value) * curRate() / 100); });
    k.addEventListener("input", function () { j.value = k.value === "" ? "" : Math.round(Number(k.value) * 100 / curRate()); });
  }

  /* ---------- sheet ---------- */
  function openSheet(html) {
    $sheetBody.innerHTML = html; $sheet.hidden = false;
    var f = $sheetBody.querySelector("input,select,textarea,button.btn");
    if (f) setTimeout(function () { try { f.focus(); } catch (e) {} }, 30);
  }
  function closeSheet() { $sheet.hidden = true; $sheetBody.innerHTML = ""; state.sheet = null; }
  function sheetHead(title) { return '<div class="panel-head"><h2>' + esc(title) + '</h2><button class="icon-btn" type="button" aria-label="닫기" data-act="close-sheet">' + ic("x") + "</button></div>"; }
  function confirmSheet(msg, act, extra) {
    state.sheet = { act: act, extra: extra };
    openSheet(sheetHead("확인") + '<p style="margin-top:8px">' + esc(msg) + '</p><div class="btnrow"><button class="btn danger" type="button" data-act="confirm-yes">삭제, 되돌리기</button><button class="btn ghost" type="button" data-act="close-sheet">취소</button></div>');
  }

  function guard() {
    if (!state.db || !state.canWrite) { toast("수정 권한이 없어요."); return false; }
    return true;
  }
  function failWrite(e) {
    if (e && e.code === "invalid_argument") { state.canWrite = false; state.edit = false; toast("수정 권한이 없어서 저장하지 못했어요."); render(); }
    else if (e && e.code === "quota_exceeded") toast("저장 공간이 가득 찼어요. 오래된 내용을 지워 주세요.");
    else toast("저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.");
  }
  function saveItems(di, list) {
    state.days["d" + (di + 1)] = { items: list }; render();
    return state.db.doc("days/d" + (di + 1)).set({ items: list }).catch(failWrite);
  }

  function itemSheet(idx) {
    var di = state.day, list = items(di);
    var it = idx >= 0 ? list[idx] : { id: uid(), time: "", title: "", place: "", note: "", move: "" };
    state.sheet = { kind: "item", idx: idx, id: it.id };
    openSheet(sheetHead(idx >= 0 ? "일정 수정" : "일정 추가") +
      '<form id="itemForm" autocomplete="off"><div class="grid2"><div><label for="f-time">시각</label><input id="f-time" name="time" type="text" placeholder="10:30" value="' + esc(it.time) + '"></div><div><label for="f-move">이동 정보</label><input id="f-move" name="move" type="text" placeholder="차량 약 1시간" value="' + esc(it.move) + '"></div></div>' +
      '<label for="f-title">제목</label><input id="f-title" name="title" type="text" required value="' + esc(it.title) + '">' +
      '<label for="f-place">구글맵 검색어 (비우면 지도 버튼이 안 보여요)</label><input id="f-place" name="place" type="text" placeholder="장소 이름이나 주소" value="' + esc(it.place) + '">' +
      '<label for="f-note">메모</label><textarea id="f-note" name="note">' + esc(it.note) + "</textarea>" +
      '<div class="btnrow"><button class="btn" type="submit">저장</button><button class="btn ghost" type="button" data-act="close-sheet">취소</button></div></form>' +
      (idx >= 0 ? '<div class="btnrow"><button class="btn ghost sm" type="button" data-act="item-up"' + (idx === 0 ? " disabled" : "") + ">" + ic("up") + '위로</button><button class="btn ghost sm" type="button" data-act="item-down"' + (idx === list.length - 1 ? " disabled" : "") + ">" + ic("down") + '아래로</button><button class="btn danger sm" type="button" data-act="item-del">' + ic("trash") + "삭제</button></div>" : ""));
  }
  function expSheet() {
    state.sheet = { kind: "exp" };
    openSheet(sheetHead("비용 추가") + '<form id="expForm" autocomplete="off"><label for="e-title">항목</label><input id="e-title" name="title" type="text" required placeholder="점심 식사, 주유, 입장료">' +
      '<div class="grid2"><div><label for="e-amt">금액</label><input id="e-amt" name="amount" type="number" inputmode="decimal" min="0" step="any" required></div><div><label for="e-cur">통화</label><select id="e-cur" name="cur"><option value="JPY">엔 (JPY)</option><option value="KRW">원 (KRW)</option></select></div></div>' +
      '<label for="e-payer">결제한 사람</label><select id="e-payer" name="payer">' + HH.map(function (g) { return '<option value="' + g.k + '">' + esc(g.name) + " (" + esc(g.who) + ")</option>"; }).join("") + "</select>" +
      '<div class="btnrow"><button class="btn" type="submit">저장</button><button class="btn ghost" type="button" data-act="close-sheet">취소</button></div></form>');
  }
  function resSheet(key) {
    var r = RES.filter(function (x) { return x.key === key; })[0], v = state.res[key] || {};
    state.sheet = { kind: "res", key: key };
    openSheet(sheetHead(r.label) + '<form id="resForm" autocomplete="off"><label for="r-status">상태</label><select id="r-status" name="status">' + STATUS.map(function (s) { return '<option' + ((v.status || "미정") === s ? " selected" : "") + ">" + s + "</option>"; }).join("") + "</select>" +
      '<label for="r-memo">메모 (예약 번호, 가격, 연락처)</label><textarea id="r-memo" name="memo">' + esc(v.memo || "") + '</textarea><div class="btnrow"><button class="btn" type="submit">저장</button><button class="btn ghost" type="button" data-act="close-sheet">취소</button></div></form>');
  }
  function packSheet() {
    state.sheet = { kind: "pack" };
    var cats = PACK.map(function (c) { return c.cat; });
    openSheet(sheetHead("준비물 추가") + '<form id="packForm" autocomplete="off"><label for="p-cat">분류</label><select id="p-cat" name="cat">' + cats.map(function (c) { return "<option>" + esc(c) + "</option>"; }).join("") + '</select><label for="p-text">준비물</label><input id="p-text" name="text" type="text" required><div class="btnrow"><button class="btn" type="submit">추가</button><button class="btn ghost" type="button" data-act="close-sheet">취소</button></div></form>');
  }
  function settingsSheet() {
    state.sheet = { kind: "settings" };
    openSheet(sheetHead("출발일 설정") + '<form id="setForm"><label for="s-date">출발일</label><input id="s-date" name="startDate" type="date" value="' + esc(state.settings.startDate || "") + '"><p class="muted" style="margin-top:6px">비우면 D-day를 숨겨요.</p><div class="btnrow"><button class="btn" type="submit">저장</button><button class="btn ghost" type="button" data-act="close-sheet">취소</button></div></form>');
  }

  /* ---------- actions ---------- */
  function setTab(t) { state.tab = t; if (location.hash !== "#" + t) { try { history.replaceState(null, "", "#" + t); } catch (e) { location.hash = t; } } render(); window.scrollTo(0, 0); }

  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-act]"); if (!el) return;
    var act = el.getAttribute("data-act");
    if (act === "tab") return setTab(el.getAttribute("data-tab"));
    if (act === "go-more") return setTab("more");
    if (act === "day") { state.day = Number(el.getAttribute("data-day")); lsSet("fuk-day", String(state.day)); return render(); }
    if (act === "toggle-edit") { state.edit = !state.edit; return render(); }
    if (act === "close-sheet") return closeSheet();
    if (act === "copy") {
      var c = CONTACTS[Number(el.getAttribute("data-i"))];
      try { navigator.clipboard.writeText(c[1]).then(function () { toast("번호를 복사했어요."); }, function () { toast(c[1]); }); } catch (e) { toast(c[1]); }
      return;
    }
    if (act === "item-edit") return itemSheet(Number(el.getAttribute("data-idx")));
    if (act === "item-add") return itemSheet(-1);
    if (act === "day-reset") return confirmSheet((state.day + 1) + "일차를 처음 일정으로 되돌릴까요? 수정한 내용이 사라져요.", "day-reset");
    if (act === "item-del") return confirmSheet("이 일정을 삭제할까요?", "item-del", { id: state.sheet && state.sheet.id });
    if (act === "exp-add") return expSheet();
    if (act === "exp-del") return confirmSheet("이 비용을 삭제할까요?", "exp-del", { id: el.getAttribute("data-id") });
    if (act === "res-edit") return resSheet(el.getAttribute("data-key"));
    if (act === "pack-add") return packSheet();
    if (act === "pack-del") return confirmSheet("이 준비물을 삭제할까요?", "pack-del", { id: el.getAttribute("data-id") });
    if (act === "settings") return settingsSheet();
    if (act === "item-up" || act === "item-down") {
      if (!guard()) return;
      var di = state.day, list = items(di).slice(), i = state.sheet.idx, j = act === "item-up" ? i - 1 : i + 1;
      if (j < 0 || j >= list.length) return;
      var t = list[i]; list[i] = list[j]; list[j] = t;
      closeSheet(); return void saveItems(di, list);
    }
    if (act === "check") {
      if (!state.edit || !guard()) return;
      var id = el.getAttribute("data-id"); if (state.pending[id]) return;
      state.pending[id] = true; var next = !state.checks[id];
      state.checks[id] = next; render();
      state.db.doc("checks/" + id).set({ done: next }).catch(failWrite).then(function () { state.pending[id] = false; });
      return;
    }
    if (act === "rate-save") {
      if (!guard()) return;
      var v = Number(document.getElementById("rateIn").value);
      if (!(v > 0)) return toast("환율을 숫자로 입력해 주세요.");
      state.settings.rate = v; render();
      state.db.doc("settings/main").set({ rate: v, startDate: state.settings.startDate || "" }).then(function () { toast("환율을 저장했어요."); }, failWrite);
      return;
    }
    if (act === "confirm-yes") {
      var s = state.sheet; if (!s || !guard()) return closeSheet();
      closeSheet();
      if (s.act === "day-reset") { var d = state.day; delete state.days["d" + (d + 1)]; render(); state.db.doc("days/d" + (d + 1)).delete().catch(failWrite); }
      else if (s.act === "item-del") { var di2 = state.day, l2 = items(di2).filter(function (x) { return x.id !== s.extra.id; }); saveItems(di2, l2); }
      else if (s.act === "exp-del") { state.expenses = state.expenses.filter(function (x) { return x.id !== s.extra.id; }); render(); state.db.doc("expenses/" + s.extra.id).delete().catch(failWrite); }
      else if (s.act === "pack-del") { state.custom = state.custom.filter(function (x) { return x.id !== s.extra.id; }); render(); state.db.doc("checkitems/" + s.extra.id).delete().catch(failWrite); state.db.doc("checks/" + s.extra.id).delete().catch(function () {}); }
    }
  });

  document.addEventListener("submit", function (ev) {
    var f = ev.target; ev.preventDefault();
    if (!guard()) return;
    var d = new FormData(f), s = state.sheet || {};
    if (f.id === "itemForm") {
      var di = state.day, list = items(di).slice();
      var it = { id: s.id, time: String(d.get("time") || "").trim(), title: String(d.get("title") || "").trim(), place: String(d.get("place") || "").trim(), note: String(d.get("note") || "").trim(), move: String(d.get("move") || "").trim() };
      if (!it.title) return toast("제목을 입력해 주세요.");
      if (s.idx >= 0) list[s.idx] = it; else list.push(it);
      closeSheet(); saveItems(di, list);
    } else if (f.id === "expForm") {
      var amount = Number(d.get("amount"));
      if (!(amount >= 0) || !isFinite(amount)) return toast("금액을 숫자로 입력해 주세요.");
      var e = { title: String(d.get("title") || "").trim(), amount: amount, cur: d.get("cur") === "KRW" ? "KRW" : "JPY", payer: String(d.get("payer")), ts: Date.now() };
      if (!e.title) return toast("항목을 입력해 주세요.");
      var ref = state.db.collection("expenses").doc();
      state.expenses = [Object.assign({ id: ref.id }, e)].concat(state.expenses); closeSheet(); render();
      ref.set(e).catch(failWrite);
    } else if (f.id === "resForm") {
      var rv = { status: String(d.get("status")), memo: String(d.get("memo") || "").trim() };
      state.res[s.key] = rv; closeSheet(); render();
      state.db.doc("reservations/" + s.key).set(rv).catch(failWrite);
    } else if (f.id === "packForm") {
      var txt = String(d.get("text") || "").trim(); if (!txt) return;
      var pref = state.db.collection("checkitems").doc(), pv = { cat: String(d.get("cat")), text: txt, ts: Date.now() };
      state.custom = state.custom.concat([Object.assign({ id: pref.id }, pv)]); closeSheet(); render();
      pref.set(pv).catch(failWrite);
    } else if (f.id === "setForm") {
      var sd = String(d.get("startDate") || ""); state.settings.startDate = sd; closeSheet(); render();
      state.db.doc("settings/main").set({ rate: state.settings.rate, startDate: sd }).catch(failWrite);
    }
  });

  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && !$sheet.hidden) closeSheet(); });
  document.addEventListener("focusout", function () { setTimeout(function () { if (state.dirty) render(); }, 0); });
  window.addEventListener("hashchange", function () {
    var h = location.hash.replace("#", "");
    if (["schedule", "map", "money", "booking", "packing", "more"].indexOf(h) >= 0 && h !== state.tab) { state.tab = h; render(); }
  });

  /* ---------- shared data ---------- */
  function subscribe(db) {
    var need = ["days", "expenses", "checks", "custom", "res", "settings"], timer;
    function done(k) { state.loaded[k] = true; if (need.every(function (n) { return state.loaded[n]; })) { state.ready = true; clearTimeout(timer); } render(); }
    function fail(e) { if (e && e.code === "revoked") { state.db = null; state.canWrite = false; state.edit = false; state.dbNull = true; } render(); }
    timer = setTimeout(function () { if (!state.ready) { state.timedOut = true; render(); } }, 10000);
    db.collection("days").onSnapshot(function (s) { var m = {}; s.docs.forEach(function (d) { var v = d.data(); if (v && Array.isArray(v.items)) m[d.id] = v; }); state.days = m; done("days"); }, fail);
    db.collection("expenses").onSnapshot(function (s) {
      state.expenses = s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); }); done("expenses");
    }, fail);
    db.collection("checks").onSnapshot(function (s) { var m = {}; s.docs.forEach(function (d) { var v = d.data(); if (v && v.done) m[d.id] = true; }); state.checks = m; done("checks"); }, fail);
    db.collection("checkitems").onSnapshot(function (s) {
      state.custom = s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); }); done("custom");
    }, fail);
    db.collection("reservations").onSnapshot(function (s) { var m = {}; s.docs.forEach(function (d) { m[d.id] = d.data(); }); state.res = m; done("res"); }, fail);
    db.doc("settings/main").onSnapshot(function (s) { var v = s.exists ? s.data() : null; if (v) { if (Number(v.rate) > 0) state.settings.rate = Number(v.rate); state.settings.startDate = typeof v.startDate === "string" ? v.startDate : ""; } done("settings"); }, fail);
  }

  /* ---------- start ---------- */
  var h0 = location.hash.replace("#", "");
  if (["schedule", "map", "money", "booking", "packing", "more"].indexOf(h0) >= 0) state.tab = h0;
  var d0 = Number(lsGet("fuk-day")); if (d0 >= 0 && d0 < 4) state.day = d0;
  render();

  (async function () {
    var claude = window.claude;
    if (!claude || !claude.use) { state.dbNull = true; state.standalone = true; render(); return; }
    var db = null, user = null;
    try { db = await claude.use("db"); } catch (e) { db = null; }
    try { user = await claude.use("user"); } catch (e) { user = null; }
    if (!db) { state.dbNull = true; render(); return; }
    state.db = db;
    var cw = null, owner = false, edit = false;
    try { if (user) { cw = await user.can("data.write"); owner = await user.isOwner(); edit = await user.canEdit(); } } catch (e) {}
    state.canWrite = cw === true || (cw === null && (owner || edit));
    subscribe(db);
    render();
  })();
})();
</script>
